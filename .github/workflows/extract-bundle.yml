name: Extract Hermes JavaScript Bundle

on:
  workflow_dispatch:
  push:
    paths:
      - "netmirror-decompiled-js.zip"
      - ".github/workflows/extract-bundle.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          set -e
          mkdir -p decompiled
          unzip -o netmirror-decompiled-js.zip -d decompiled
          echo "Extracted files:"
          find decompiled -maxdepth 3 -type f -print

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decompiled
          if git diff --cached --quiet; then
            echo "No extracted-file changes to commit."
          else
            git commit -m "Extract decompiled Hermes JavaScript source"
            git push
          fi
